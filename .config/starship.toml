# ✦

[cmd_duration]
disabled = false
min_time = 0
format = "[$duration](#7695a0)"
style = "bold blue"

[character]
format='$symbol'
error_symbol='[ ](#eb6f92)'
success_symbol='[ ](#7695a0)'

[hostname]
ssh_only = false
format = ' [$hostname](#eab676)'

[custom.github_pr]
when = true
command = '/home/rspurgeon/dev/rspurgeon/dots/.local/bin/starship-github-pr'
format = '([\(#$output\)](#858983) )'

[custom.kongctl_profile]
when = 'test -n "$KONGCTL_PROFILE"'
command = 'profile="$KONGCTL_PROFILE"; case "$profile" in *_tech) printf "%s" "${profile%_tech}" ;; *_com) printf "%s" "${profile%_com}" ;; *) printf "%s" "$profile" ;; esac'
format = '[󱐋](#CCFF00) [$output](#858983)'

[custom.kongctl_profile_env]
when = 'case "$KONGCTL_PROFILE" in *_tech|*_com) exit 0 ;; *) exit 1 ;; esac'
command = 'case "$KONGCTL_PROFILE" in *_tech) printf "_tech" ;; *_com) printf "_com" ;; esac'
format = '[$output](#CCFF00)'

[aws]
disabled=false
format=' [  $symbol](white)[($profile )(\($region\) )(\[$duration\] )](#eab676) '
#symbol = "  "
#symbol=" : "
symbol=''

[terraform]
disabled=true

[status]
disabled=true

[directory]
format=" $path"
truncation_length=2
truncate_to_repo=false
fish_style_pwd_dir_length=0

[git_branch]
format="[$symbol](#6e6a86)[$branch(:$remote_branch)](#f6c177) "

[git_status]
format='([\[$modified$ahead_behind\]](#7695a0) )'

[kubernetes]
disabled=false
format = '[$symbol](white)[$context](#e28743) '

[kubernetes.context_aliases]
"arn:aws:eks:(?P<var_region>[\\w-]+):(?P<var_acct>[\\d]+):cluster/(?P<var_cluster>[\\w-]+)" = "$var_cluster => $var_region"
"gke_.*_(?P<var_cluster>[\\w-]+)" = "gke-$var_cluster"
