general {
    # Keep locking enabled while isolating the suspected AMD/DPMS hard-reset path.
    lock_cmd = env OMARCHY_LOCK_ONLY=true omarchy-system-lock
    before_sleep_cmd = loginctl lock-session               # lock before suspend.
    after_sleep_cmd = sleep 1 && hyprctl dispatch dpms on  # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Temporarily disabled for crash isolation (2026-07-22). This launched one
# 120 FPS terminal animation per monitor after 10 minutes of inactivity.
# listener {
#     timeout = 600
#     on-timeout = pidof hyprlock || omarchy-launch-screensaver
# }

listener {
    timeout = 900                      # 15min
    on-timeout = loginctl lock-session # lock screen when timeout has passed
}

listener {
    timeout = 1800                                           # 30min
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0  # save state and turn off keyboard backlight
    on-resume = brightnessctl -rd '*::kbd_backlight'         # restore keyboard backlight
}

# Turn off both displays after 30 minutes of inactivity.
listener {
    timeout = 1800
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}
